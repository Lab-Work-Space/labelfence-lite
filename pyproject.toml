[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labelfence"
version = "1.0.0"
description = "Audit object-detection datasets in YOLO format: find broken labels, missing files and class problems before training."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Labworkspace" }]
dependencies = [
  "numpy>=2.2,<2.6",
  "Pillow>=12.3,<12.4",
]

[project.scripts]
labelfence = "labelfence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
